components:
  schemas:
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 255
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 255
        display_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - code
      - name
    CsrfTokenOutput:
      type: object
      properties:
        csrf_token:
          type: string
          readOnly: true
      required:
      - csrf_token
    CustomizationInputRequest:
      type: object
      properties:
        variant_id:
          type: integer
        topping_ids:
          type: array
          items:
            type: integer
        sweetness:
          type: string
          default: ''
        ice:
          type: string
          default: ''
        quantity:
          type: integer
          maximum: 99
          minimum: 1
          default: 1
      required:
      - variant_id
    CustomizationResult:
      type: object
      properties:
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - total_price
      - unit_price
    EmployeeInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        full_name:
          type: string
          minLength: 1
          maxLength: 255
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - full_name
      - password
    ImportConfirmRequest:
      type: object
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - idempotency_key
    ImportJob:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        module:
          type: string
          maxLength: 40
        mode:
          $ref: '#/components/schemas/ModeEnum'
        status:
          $ref: '#/components/schemas/StatusEnum'
        original_name:
          type: string
          maxLength: 255
        total_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        new_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        update_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        error_rows:
          type: integer
          maximum: 2147483647
          minimum: 0
        preview: {}
        issues:
          type: array
          items:
            $ref: '#/components/schemas/RowIssue'
          readOnly: true
        created_by_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        validated_at:
          type: string
          format: date-time
          nullable: true
        confirmed_at:
          type: string
          format: date-time
          nullable: true
      required:
      - created_at
      - created_by_name
      - id
      - issues
      - mode
      - module
      - original_name
    ImportUploadRequest:
      type: object
      properties:
        module:
          $ref: '#/components/schemas/ModuleEnum'
        mode:
          $ref: '#/components/schemas/ModeEnum'
        file:
          type: string
          format: binary
      required:
      - file
      - mode
      - module
    Ingredient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        code:
          type: string
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          maxLength: 140
        base_unit:
          type: integer
        track_lot:
          type: boolean
        minimum_level:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        is_active:
          type: boolean
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - base_unit
      - code
      - id
      - name
    IngredientRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[-a-zA-Z0-9_]+$
        name:
          type: string
          minLength: 1
          maxLength: 140
        base_unit:
          type: integer
        track_lot:
          type: boolean
        minimum_level:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,6})?$
        is_active:
          type: boolean
        version:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - base_unit
      - code
      - name
    Liveness:
      type: object
      properties:
        status:
          type: string
          readOnly: true
      required:
      - status
    LoginInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    LoginOutput:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/UserOutput'
          readOnly: true
      required:
      - access
      - user
    ModeEnum:
      enum:
      - create
      - update
      - upsert
      type: string
      description: |-
        * `create` - Tạo mới
        * `update` - Cập nhật
        * `upsert` - Tạo hoặc cập nhật
    ModuleEnum:
      enum:
      - categories
      - ingredients
      - products
      - suppliers
      type: string
      description: |-
        * `categories` - categories
        * `ingredients` - ingredients
        * `products` - products
        * `suppliers` - suppliers
